<!doctype html>
<html lang="en" data-partlet-page="{{ page.kind }}" data-partlet-output-version="{{ page.output_version }}" data-theme="{{ theme.name if theme else 'classic' }}" data-mode="{{ theme.mode if theme else 'auto' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ theme.stylesheet_url if theme else '/_partlet/style.css' }}">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">{{ page.identity.name }}</a>
  </div>
</header>
<main id="content" tabindex="-1"{% if page.project is defined %} data-partlet-project="{{ page.project.name }}"{% endif %}>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">{% if page.identity.tagline %}<span>{{ page.identity.tagline }}</span>{% endif %}<span>Published with <a href="https://github.com/vhata/partlet">Partlet</a></span></footer>
</body>
</html>
