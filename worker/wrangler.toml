# Partlet Worker: serves one source's published projects from R2, read-only.
# The user deploys it (npx wrangler deploy, from this directory) after
# choosing an address and replacing placeholders; see docs/GETTING_STARTED.md.
# For workers.dev, remove the whole [[routes]] block and add workers_dev = true
# here at the top level, before [vars].
# Agents never deploy it or provision the bucket, Worker or domain.
name = "partlet"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Key prefix in the bucket: the `[site] source` value in the monorepo's
# partlet.toml.
SOURCE = "replace-me"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "replace-me"

[[routes]]
# Custom domain: one exact hostname you choose on your Cloudflare-managed
# domain, with no scheme, path or wildcard. All paths go to this Worker;
# Cloudflare manages DNS and HTTPS. Omit this whole block for workers.dev.
pattern = "partlet.replace-me.example"
custom_domain = true
