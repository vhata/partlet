[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partlet"
dynamic = ["version"]
description = "Publish selected directories of a private monorepo as read-only Git repositories"
requires-python = ">=3.12"
dependencies = [
  "git-filter-repo==2.47.0",
  "boto3>=1.36",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "pygments>=2.18",
  "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = [
  "mdformat==1.0.0",
  "mdformat-gfm==1.0.0",
  "moto[server]>=5.1",
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.6",
]

[project.scripts]
partlet = "partlet.cli:main"

[tool.hatch.version]
path = "src/partlet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/partlet"]

[tool.hatch.build.targets.wheel.force-include]
"worker/src" = "partlet/_assets/worker/src"
"worker/package.json" = "partlet/_assets/worker/package.json"
"worker/package-lock.json" = "partlet/_assets/worker/package-lock.json"
"worker/.node-version" = "partlet/_assets/worker/.node-version"
"worker/wrangler.toml" = "partlet/_assets/worker/wrangler.toml"
"worker/tools/seed-r2.mjs" = "partlet/_assets/worker/tools/seed-r2.mjs"
"scripts/install-gitleaks.sh" = "partlet/_assets/scripts/install-gitleaks.sh"

# Explicit inputs keep local npm dependencies and worktree caches out of
# source releases, including builds from a Git worktree's .git file.
[tool.hatch.build.targets.sdist]
include = [
  "/src/partlet/**/*.py",
  "/src/partlet/site/templates/*.html",
  "/src/partlet/site/themes/*.css",
  "/scripts/install.sh",
  "/scripts/install-gitleaks.sh",
  "/worker/src/*.ts",
  "/worker/tools/seed-r2.mjs",
  "/worker/package.json",
  "/worker/package-lock.json",
  "/worker/.node-version",
  "/worker/wrangler.toml",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["e2e: publisher CLI through simulated S3, local R2 and public Worker routes"]
addopts = "-m 'not e2e'"
