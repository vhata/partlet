{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block main %}
<h1>Projects</h1>
<table class="listing projects">
{% for p in projects %}<tr><td class="project-name"><a href="/{{ p.name }}">{{ p.name }}</a></td><td class="description">{{ p.description }}</td><td class="revision"><code>{{ p.tip[:12] }}</code></td><td class="updated">{{ p.updated }}</td></tr>
{% endfor %}
</table>
{% endblock %}
