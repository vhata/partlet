<!doctype html>
<html lang="en"{% if theme %} data-theme="{{ theme.name }}" data-mode="{{ theme.mode }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ theme.stylesheet_url if theme else '/_partlet/style.css' }}">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">p</span>Partlet</a>
    <a class="home-link" href="/">Public repositories</a>
  </div>
</header>
<main id="content" tabindex="-1">
{% block main %}{% endblock %}
</main>
<footer class="site-footer"><span>Code, out in the open.</span><span>Published with <a href="/">Partlet</a></span></footer>
</body>
</html>
