# Merge-blocking checks. Every job calls a script in scripts/ or
# docket/scripts/, so `bash scripts/check.sh` reproduces the check job
# locally and `bash docket/scripts/ci.sh` the workflow job. See
# docs/QUALITY.md.
name: CI

on:
  pull_request:
    # edited: a re-run reuses the original event payload, so without this
    # trigger an edited PR body is re-validated as it was before the edit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  # ci.sh reads the PR body from the event payload; pull-requests: read covers
  # its fallback to `gh pr view` when jq is missing or the payload describes
  # another pull request.
  pull-requests: read

defaults:
  run:
    shell: bash   # explicit bash gives `-eo pipefail`

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches only. Cancelling runs on main hides
  # red builds when several PRs merge in quick succession.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on ubuntu-latest; uv provides Python.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: worker/.node-version
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: bash scripts/setup.sh
      - run: bash scripts/check.sh

  workflow:
    name: Queue and PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Queue hygiene, Markdown links and, on pull requests, the PR markers.
      # The PR variables are empty on push events and ci.sh then skips the
      # marker check.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash docket/scripts/ci.sh

  action:
    name: Action smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: 'false'
      - id: fixture-tools
        name: Install locked fixture tools
        run: bash action/install.sh
      - name: Prepare approved synthetic checkout
        env:
          PY: ${{ steps.fixture-tools.outputs.python }}
        run: |
          "$PY" -I action/smoke.py prepare "$RUNNER_TEMP/partlet-smoke"
      - uses: ./
        with:
          repo: ${{ runner.temp }}/partlet-smoke/mono
          local-out: ${{ runner.temp }}/partlet-smoke/site
      - name: Verify approved publication
        env:
          PY: ${{ steps.fixture-tools.outputs.python }}
        run: |
          "$PY" -I action/smoke.py verify "$RUNNER_TEMP/partlet-smoke"

  e2e:
    name: Publisher-to-Worker end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: worker/.node-version
      - run: bash scripts/setup.sh
      - run: bash scripts/e2e.sh
